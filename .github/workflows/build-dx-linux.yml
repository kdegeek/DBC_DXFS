name: Run DX Make on Ubuntu
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Cache build dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache
          openssl
        key: ${{ runner.os }}-dx-build-${{ hashFiles('Makefile.dx.linux') }}
        restore-keys: |
          ${{ runner.os }}-dx-build-
          
    - name: Make
      run: |
        make -f Makefile.dx.linux all
        
    - name: Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DXlinux
        path: |
          dbc
          dbcd
          dbcmp
          dbcsc
          dbcsql.so
