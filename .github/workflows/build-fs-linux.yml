name: Run FS Make on Ubuntu
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install ODBC development headers
      run: sudo apt-get update && sudo apt-get install -y unixodbc-dev
      
    - name: Cache build dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache
          openssl
        key: ${{ runner.os }}-fs-build-${{ hashFiles('Makefile.fs.linux') }}
        restore-keys: |
          ${{ runner.os }}-fs-build-
          
    - name: Make
      run: |
        make -f Makefile.fs.linux all
        
    - name: Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FSlinux
        path: |
          dbcfs
          dbcfsadm
          dbcfsrun
          setupodb
          fsodbc.a
          fsodbcu.a
