name: Compile and jar Java Smart Client
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Cache Java dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-java-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-java-
          
    - name: Compile
      working-directory: ./SmartClient_Java/src
      run: |
        javac -cp '../lib/*' -d ../bin @srcfiles.list
        
    - name: Jar the class files
      working-directory: ./SmartClient_Java/bin
      run: |
        jar cmf ./Manifest.mf dbcsc.jar ./*
        
    - name: Jar the icons
      working-directory: ./SmartClient_Java
      run: |
        jar uf bin/dbcsc.jar ./Images/*
        
    - name: Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DBCSC
        path: |
          SmartClient_Java/bin/dbcsc.jar
