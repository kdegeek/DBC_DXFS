name: Run Utilities Make on Ubuntu
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Cache build dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache
          openssl
        key: ${{ runner.os }}-utils-build-${{ hashFiles('Makefile.common.linux') }}
        restore-keys: |
          ${{ runner.os }}-utils-build-
          
    - name: Make
      run: make -f Makefile.common.linux all
      
    - name: Artifact
      uses: actions/upload-artifact@v4
      with:
        name: utilslinux
        path: |
          aimdex
          build
          chain
          copy
          create
          delete
          dump
          edit
          encode
          exist
          filechk
          index
          library
          list
          reformat
          rename
          sort
          tdcmp
