name: Run FS Make on Windows
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Cache build dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~\AppData\Local\Temp
          openssl
        key: ${{ runner.os }}-fs-build-${{ hashFiles('Makefile.fs.windows') }}
        restore-keys: |
          ${{ runner.os }}-fs-build-
          
    - name: Make FS Server binaries
      run: |
        make -f Makefile.fs.windows dbcfsadm.exe dbcfs.exe dbcfsrun.exe
        
    - name: Artifact One
      uses: actions/upload-artifact@v4
      with:
        name: FSServerwindows
        path: |
          dbcfsadm.exe
          dbcfs.exe
          dbcfsrun.exe
          
    - name: Install NSIS
      run: choco install nsis
      
    - name: Make ODBC Drivers
      run: |
        make -f Makefile.fs.windows setupodb.exe setupodb64.exe
        mv fs/setupodb.exe .
        mv fs/setupodb64.exe .
        
    - name: Artifact Two
      uses: actions/upload-artifact@v4
      with:
        name: FSClientwindows
        path: |
          setupodb.exe
          setupodb64.exe
