name: Build Debian package
on:
  push:
    branches: [ feature/dccapp-runner-deb ]
  pull_request:
    branches: [ feature/dccapp-runner-deb ]
jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential devscripts debhelper dpkg-dev desktop-file-utils shared-mime-info xdg-utils
      - name: Make scripts executable
        run: |
          [ -f tools/dccapp-runner/dccapp_parse.sh ] && chmod +x tools/dccapp-runner/dccapp_parse.sh
          [ -f tools/dccapp-runner/ini_to_env.sh ] && chmod +x tools/dccapp-runner/ini_to_env.sh
          [ -f tools/dccapp-runner/dccapl-linux ] && chmod +x tools/dccapp-runner/dccapl-linux
      - name: Build package
        run: |
          debuild -us -uc
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dbc-dxfs-dccapp-runner-debs
          path: |
            ../*.deb
            ../*.buildinfo
            ../*.changes
