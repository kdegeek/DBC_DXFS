name: Build Debian package
on:
  push:
    branches: [ feature/dccapp-runner-deb ]
  pull_request:
    branches: [ feature/dccapp-runner-deb ]
jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect repo tree
        run: |
          git status
          ls -la
          if [ -e debian/compat ]; then echo "Found debian/compat in checkout"; fi
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential devscripts debhelper dpkg-dev desktop-file-utils shared-mime-info xdg-utils
      - name: Ensure no debian/compat (compat via debhelper-compat)
        run: |
          if [ -e debian/compat ]; then
            echo "Removing stale debian/compat"
            git rm -f debian/compat || rm -f debian/compat || true
          fi
          test ! -e debian/compat || { echo "debian/compat still present"; exit 1; }
      - name: Make scripts executable
        run: |
          chmod +x tools/dccapp-runner/dccapp_parse.sh || true
          chmod +x tools/dccapp-runner/ini_to_env.sh || true
          chmod +x tools/dccapp-runner/dccapl-linux || true
      - name: Build package
        run: |
          debuild -us -uc
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dbc-dxfs-dccapp-runner-debs
          path: |
            ../*.deb
            ../*.buildinfo
            ../*.changes
