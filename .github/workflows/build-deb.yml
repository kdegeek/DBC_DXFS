name: Build Debian package
on:
  push:
    branches: [ feature/dccapp-runner-deb ]
  pull_request:
    branches: [ feature/dccapp-runner-deb ]
jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure no debian/compat
        run: |
          if [ -e debian/compat ]; then rm -f debian/compat; fi
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential devscripts debhelper dpkg-dev desktop-file-utils shared-mime-info xdg-utils
      - name: Make scripts executable
        run: |
          chmod +x tools/dccapp-runner/dccapp_parse.sh || true
          chmod +x tools/dccapp-runner/ini_to_env.sh || true
          chmod +x tools/dccapp-runner/dccapl-linux || true
      - name: Build package
        env:
          DEB_BUILD_OPTIONS: nocheck
        run: |
          debuild -us -uc -d
      - name: Collect artifacts
        run: |
          mkdir -p dist
          shopt -s nullglob
          for f in ../*.deb ../*.buildinfo ../*.changes; do cp -v "$f" dist/; done
          ls -la dist
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dbc-dxfs-dccapp-runner-debs
          path: dist/*
