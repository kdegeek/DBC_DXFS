name: Run DX Make on Windows
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Cache build dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~\AppData\Local\Temp
          openssl
        key: ${{ runner.os }}-dx-build-${{ hashFiles('Makefile.dx.windows') }}
        restore-keys: |
          ${{ runner.os }}-dx-build-
          
    - name: Make
      run: |
        make -f Makefile.dx.windows all
        
    - name: Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DXwindows
        path: |
          dbcscc.exe
          dbcmp.exe
          dbcd.exe
          dbccom.dll
          dbcc.exe
          dbcsc.exe
          dbc.exe
